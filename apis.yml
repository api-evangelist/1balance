name: 1Balance
description: >-
  1Balance (1Balance Living) is a personalized herbal-wellness and tea brand offering curated
  caffeinated and caffeine-free tisane blends formulated for different times of day — spanning gut
  health, energy, metabolism, adaptogenic immune support, relaxation, and menopause support. The
  company blends traditional herbal science and personalization (drawing on Ayurveda and naturopathy)
  with modern subscription commerce, selling whole-herb capsule and loose-leaf tea blends directly to
  consumers through a Shopify-powered storefront with free shipping over $30 and a 30-day money-back
  guarantee. Backed by an Accel-led seed round, 1Balance operates as a US/India direct-to-consumer
  consumer-wellness company. This API Evangelist profile tracks 1Balance as a consumer brand; it runs
  a retail e-commerce experience and does not publish a public developer API, SDKs, or developer portal.
